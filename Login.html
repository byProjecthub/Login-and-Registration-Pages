<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login UI</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Font Awesome for Eye Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link ref="stylesheet" href="css/css.css">
    
</head>

<body>

    <div class="container">

        <!-- LEFT LOGIN -->
        <div class="login-box">

            <div class="logo">
                <div style="width:14px;height:14px;background:#4b5cff;border-radius:4px"></div>
                <span>Untitled UI</span>
            </div>

            <h2>Log in</h2>
            <p>Welcome back! Please enter your details.</p>

            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="Enter your email">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password">
                <i class="fa-solid fa-eye toggle-password" onclick="togglePassword()"></i>
            </div>

            <div class="options">
                <label><input type="checkbox"> Remember for 30 days</label>
                <a href="forget-password.html">Forgot password</a>
            </div>

            <button class="signin">Sign in</button>
            <button class="google-btn">Sign in with Google</button>

            <div class="signup">
                Don't have an account? <a href="Registration.html">Sign up</a>
            </div>

        </div>


        <!-- RIGHT DASHBOARD -->
        <div class="right-panel">

            <div class="dashboard-card">
                <small>Users over time</small>
                <hr style="margin:8px 0">
                <p>📈 Growth analytics preview</p>

                <div class="circle">1,000</div>
            </div>

            <div class="center-text">
                <h3>Welcome to your new dashboard</h3>
                <p>Sign in to explore changes we've made.</p>
            </div>

            <div class="dots">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>

        </div>

    </div>

    <!-- PASSWORD TOGGLE SCRIPT -->
    <script>
        function togglePassword() {
            const password = document.getElementById("password");
            const icon = document.querySelector(".toggle-password");

            if (password.type === "password") {
                password.type = "text";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                password.type = "password";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }
    </script>

</body>

</html>
