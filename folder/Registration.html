<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background:#f5f7fb;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    display:grid;
    grid-template-columns: 1fr 1fr;
    width:900px;
    height:620px;
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

/* ===== REGISTRATION PANEL ===== */

.registration-box{
    padding:45px 40px;
}

.logo{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:25px;
}

.registration-box h2{
    font-weight:600;
    margin-bottom:6px;
}

.registration-box p{
    font-size:13px;
    color:#888;
    margin-bottom:25px;
}

/* INPUT */

.input-group{
    margin-bottom:15px;
    position:relative;
}

.input-group label{
    font-size:13px;
    display:block;
    margin-bottom:5px;
}

.input-group input{
    width:100%;
    padding:12px;
    border-radius:6px;
    border:1px solid #ddd;
}

/* Password Icon */

.toggle-password{
    position:absolute;
    right:12px;
    top:38px;
    cursor:pointer;
    color:#888;
}

/* BUTTONS */

.create-btn{
    width:100%;
    padding:13px;
    border:none;
    background:#4b5cff;
    color:white;
    border-radius:6px;
    cursor:pointer;
    font-weight:500;
    margin-top:10px;
}

.google-btn{
    width:100%;
    padding:11px;
    margin-top:12px;
    border:1px solid #ddd;
    border-radius:6px;
    background:white;
    cursor:pointer;
}

.signup{
    text-align:center;
    font-size:13px;
    margin-top:20px;
}

.signup a{
    color:#4b5cff;
    text-decoration:none;
}

/* ===== RIGHT PANEL ===== */

.right-panel{
    background:linear-gradient(135deg,#3f4cdd,#5d74ff);
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px;
}

.dashboard-card{
    background:white;
    border-radius:10px;
    padding:20px;
    width:240px;
    color:black;
    margin-bottom:30px;
}

.center-text h3{
    margin-bottom:8px;
}

.dots{
    margin-top:25px;
}

.dot{
    width:8px;
    height:8px;
    background:#cfd5ff;
    border-radius:50%;
    display:inline-block;
    margin:0 4px;
}

.dot.active{
    background:white;
}

/* Responsive */

@media(max-width:800px){
    .container{
        grid-template-columns:1fr;
        height:auto;
    }
}

</style>
</head>
<body>

<div class="container">

<!-- LEFT REGISTRATION -->
<div class="registration-box">

<form method="POST" action="">

    <div class="logo">
        <div style="width:14px;height:14px;background:#4b5cff;border-radius:4px"></div>
        <span>Untitled UI</span>
    </div>

    <h2>Create Account</h2>
    <p>Please fill in your details below</p>

    <div class="input-group">
        <label>Name</label>
        <input type="text" placeholder="Enter your name" name="name" required>
    </div>

    <div class="input-group">
        <label>Surname</label>
        <input type="text" placeholder="Enter your surname" name="surname" required>
    </div>

    <div class="input-group">
        <label>Email</label>
        <input type="email" placeholder="Enter your email" name="email" required>
    </div>

    <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Create Password" name="password" required>
        <i class="fa-solid fa-eye toggle-password"
           onclick="togglePassword('password', this)"></i>
    </div>

    <div class="input-group">
        <label>Confirm Password</label>
        <input type="password" id="confirm_password" placeholder="Re-enter Password" name="confirm_password" required>
        <i class="fa-solid fa-eye toggle-password"
           onclick="togglePassword('confirm_password', this)"></i>
    </div>

    <button type="submit" class="create-btn">Create Account</button>
    <button type="button" class="google-btn">Sign up with Google</button>

    <div class="signup">
        Already have an account? <a href="login.html">Login</a>
    </div>

</form>

</div>

<!-- RIGHT PANEL -->
<div class="right-panel">

    <div class="dashboard-card">
        <small>New User Registration</small>
        <hr style="margin:8px 0">
        <p>📈 Registration Portal</p>
    </div>

    <div class="center-text">
        <h3>Welcome to our website</h3>
        <p>Sign up to explore our products and services</p>
    </div>

    <div class="dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>

</div>

</div>

<script>
function togglePassword(fieldId, icon){
    const field = document.getElementById(fieldId);

    if(field.type === "password"){
        field.type = "text";
        icon.classList.replace("fa-eye","fa-eye-slash");
    }else{
        field.type = "password";
        icon.classList.replace("fa-eye-slash","fa-eye");
    }
}
</script>

</body>
</html>
